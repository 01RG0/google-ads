[project]
name = "ads-transparency-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3", "fastapi>=0.110,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "uvicorn>=0.27"]

[tool.setuptools]
packages = ["client", "api"]

[tool.setuptools.package-data]
client = ["geo_targets_countries.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: makes a small request to the live Google Ads Transparency Center"]
